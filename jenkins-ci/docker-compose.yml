services:
  jenkins:
    build: .
    container_name: jenkins
    networks:
      - plomba-ci
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
      - "50000:50000"   # port for agents
    env_file:
      - .env
    volumes:
      - jenkins_home:/var/jenkins_home
      # Jenkins configuration as code
      - ./casc.yaml:/var/jenkins_casc/casc.yaml:ro

volumes:
  jenkins_home:

networks:
  plomba-ci:
    external: true
    name: plomba-ci