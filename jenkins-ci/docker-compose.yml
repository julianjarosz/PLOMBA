services:
  jenkins:
    build: .
    container_name: jenkins
    networks:
      - plomba-ci
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
      - "50000:50000"   # port for agents
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:

networks:
  plomba-ci:
    external: true
    name: plomba-ci