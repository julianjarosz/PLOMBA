name: plomba

services:
  nexus:
    image: sonatype/nexus3:3.98.1@sha256:91a9af44af777c353db11a5ee73850c7eb24b03c997ff4cc62a3500ad38a1332
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/service/rest/v1/status/writable"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30

volumes:
  nexus-data:
    external: true
    name: nexus-data
